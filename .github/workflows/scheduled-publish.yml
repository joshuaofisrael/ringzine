name: Publish scheduled articles

# 11:00, 15:00 and 19:00 UTC. On 29 October 2026 that is London time,
# because the clocks went back on 25 October.
on:
  schedule:
    - cron: "0 11,15,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: due
        if: github.event_name == 'schedule'
        run: python3 scripts/scheduled-due.py
      - name: Build and deploy to gh-pages
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        run: bash scripts/deploy.sh
